<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>ARIA пульт</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="conn" class="conn conn-off">OFFLINE</div>

  <div id="login" class="overlay">
    <div class="dialog">
      <p class="login-title">ARIA ПУЛЬТ</p>
      <input id="login-id" class="login-input" type="text" autocomplete="username" placeholder="идентификатор">
      <input id="login-password" class="login-input" type="password" autocomplete="current-password" placeholder="пароль">
      <p id="login-error" class="login-error hidden">неверный идентификатор или пароль</p>
      <button id="login-go" class="pad">ПОДКЛЮЧИТЬСЯ</button>
    </div>
  </div>

  <main id="app">
    <section class="now">
      <div class="status" id="status">STOP</div>
      <span id="lock" class="lock hidden">LOCKED</span>
      <div class="title" id="title">—</div>
      <div class="next" id="next">далее: —</div>
      <div class="elapsed" id="elapsed">0:00</div>
      <div class="seek" id="seek"><div id="seek-fill" class="seek-fill"></div></div>
    </section>

    <section class="timers">
      <div class="timer-block">
        <span class="timer-label">SHOW</span>
        <span class="show-clock" id="show-clock">--:--</span>
      </div>
      <div class="timer-block">
        <span class="timer-label">ОСТАЛОСЬ</span>
        <span class="track-remain" id="track-remain">--:--</span>
      </div>
    </section>

    <section class="transport">
      <button id="btn-play" class="pad">▶<span>PLAY</span></button>
      <button id="btn-pause" class="pad">‖<span>PAUSE</span></button>
      <button id="btn-stop" class="pad">■<span>STOP</span></button>
      <button id="btn-next" class="pad">→<span>NEXT</span></button>
      <button id="btn-replay" class="pad">⟲<span>REPLAY</span></button>
    </section>

    <section class="default-action">
      <span class="timer-label">ПО КОНЦУ ТРЕКА</span>
      <select id="default-action" class="inline-input">
        <option value="Pause">Пауза</option>
        <option value="Stop">Стоп</option>
        <option value="Replay">Повтор</option>
        <option value="Advance">Далее</option>
      </select>
    </section>

    <button id="btn-panic" class="panic">PANIC</button>

    <section class="mixer">
      <div class="section-header">
        <h2>МАСТЕР (ЗАЛ)</h2>
        <div class="lufs-badge">
          <span class="lufs-label">LUFS</span>
          <span id="lufs-value" class="lufs-value">—</span>
        </div>
      </div>
      <div class="preview-row">
        <input id="master" class="master" type="range" min="0" max="125" step="1" value="0">
        <button id="btn-mute" class="mute">MUTE</button>
      </div>
      <div class="lufs-bar"><div id="lufs-fill" class="lufs-fill"></div></div>
    </section>

    <section class="preview">
      <h2>МОНИТОР (НАУШНИКИ)</h2>
      <div class="preview-row">
        <button id="btn-preview-play" class="pad">▶<span>СТАРТ</span></button>
        <button id="btn-preview-stop" class="pad">■<span>СТОП</span></button>
        <input id="preview-gain" class="master" type="range" min="0" max="125" step="1" value="100">
        <button id="btn-preview-mute" class="mute">MUTE</button>
      </div>
      <audio id="preview-audio" class="preview-audio" controls preload="none"></audio>
    </section>

    <section class="click">
      <h2>МЕТРОНОМ <button id="btn-click-toggle" class="mute">ВЫКЛ</button></h2>
      <div class="preview-row">
        <label class="click-label">Пульт <input id="click-name" class="inline-input click-name" type="text" maxlength="64" placeholder="Имя пульта"></label>
      </div>
      <div class="preview-row">
        <label class="click-label">BPM <input id="click-bpm" class="inline-input click-num" type="number" min="20" max="300" step="1" value="120"></label>
        <button id="btn-click-default" class="forget" title="BPM трека">↺</button>
        <label class="click-label">Такт
          <select id="click-beats" class="inline-input click-beats">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
          </select>
        </label>
      </div>
      <div class="preview-row">
        <label class="click-label">Сдвиг мс <input id="click-offset" class="inline-input click-num" type="number" min="-2000" max="2000" step="5" value="0"></label>
        <input id="click-gain" class="master" type="range" min="0" max="125" step="1" value="100">
      </div>
    </section>

    <section class="queue">
      <h2>ОЧЕРЕДЬ <button id="btn-queue-clear" class="forget">ОЧИСТИТЬ</button> <button id="btn-forget" class="forget">забыть пару</button></h2>
      <ol id="queue"></ol>
    </section>

    <section class="playlists">
      <h2>ПРОЕКТЫ</h2>
      <div id="playlists"></div>
    </section>

    <section class="script" id="script-section">
      <h2>СЦЕНАРИЙ</h2>
      <div id="script-tabs" class="script-tabs"></div>
      <ol id="script-lines" class="script-lines"></ol>
    </section>
  </main>

  <div id="mention-menu" class="overlay hidden">
    <div class="dialog">
      <p>Выбрать трек</p>
      <div id="mention-options" class="mention-options"></div>
      <div class="dialog-buttons">
        <button id="mention-cancel" class="pad">ОТМЕНА</button>
      </div>
    </div>
  </div>

  <div id="panic-confirm" class="overlay hidden">
    <div class="dialog">
      <p>Заглушить всё?</p>
      <div class="dialog-buttons">
        <button id="panic-yes" class="pad danger">ДА, PANIC</button>
        <button id="panic-no" class="pad">ОТМЕНА</button>
      </div>
    </div>
  </div>

  <div id="clear-confirm" class="overlay hidden">
    <div class="dialog">
      <p>Очистить очередь?</p>
      <div class="dialog-buttons">
        <button id="clear-yes" class="pad danger">ДА, ОЧИСТИТЬ</button>
        <button id="clear-no" class="pad">ОТМЕНА</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
