name: Android Monitor
on:
  push:
    branches: [main]
    paths:
      - android/**
      - tests/fixtures/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - tests/fixtures/**
      - .github/workflows/android.yml
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install NDK, CMake and platforms
        run: >
          sdkmanager
          "ndk;${ANDROID_NDK_VERSION}"
          "cmake;${ANDROID_CMAKE_VERSION}"
          "platforms;android-36"
          "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Unit tests, debug APK and lint
        working-directory: android
        run: ./gradlew test assembleDebug :app:lintDebug
      - name: Engine host tests
        run: |
          cmake_bin="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin"
          "${cmake_bin}/cmake" -S android/engine -B android/engine/bin/host -DARIA_HOST_TESTS=ON
          "${cmake_bin}/cmake" --build android/engine/bin/host
          "${cmake_bin}/ctest" --test-dir android/engine/bin/host --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: aria-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
