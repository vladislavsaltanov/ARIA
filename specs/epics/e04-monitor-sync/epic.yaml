decisions:
  - "Эталон синхронизации — момент звучания основного выхода ARIA (зал)."
  - "Устойчивость важнее точной копии зального микса: телефон подкачивает PCM, декодированный хостом, и играет сам по общему таймлайну; мастер-обработка зала в мониторинг не входит."
  - "Таймлайн — зеркало микшера: строится из отрендеренного состояния голосов; момент звучания — по метке времени аудио-коллбэка шима; запас кольца (~85 мс) отдаёт изменения транспорта слушателям до того, как их услышит зал."
  - "Клик синтезируется браузером по сетке Track; между треками тишина; отсчёт закладывается в файлы."
  - "Сетка (BPM, доли, первая доля от начала файла) — свойство Track; у слушателя только уровни и вкл/выкл."
  - "Подложка — Track на вхождении (ProjectOverrides.Backing), звучит только слушателям; без неё — само вхождение."
  - "Отдельная пара слушателя: токен с ролью Listen открывает только мониторинг (ADR 0013)."
  - "Тест-клик в основной выход — единственное исключение из «клик не попадает в зал»: только явное включение, сбрасывается при старте любого голоса и при перезапуске."
  - "AudioWorklet, Wake Lock, getUserMedia недоступны по HTTP в LAN (ADR 0007): движок на AudioBufferSourceNode, удержание экрана — беззвучное видео."
acceptance:
  - "2-канальная запись основного выхода и выхода проводного телефона на 5-минутном треке с сеткой: смещение клика относительно доли на 0:30, 2:30 и 4:30 не больше 3 мс, без накопления."
  - "Два телефона одновременно: расхождение между ними не больше 3 мс."
  - "Режим полёта на 3 с посреди трека: клик и подкачанная подложка не прерываются, после восстановления синхронизация за 2 с."
  - "GO, Pause, Stop, автостоп по Marker, конец трека: проводной слушатель совпадает с залом в пределах 5 мс; Seek и PANIC — переход с отставанием не больше 60 мс, далее синхронно."
  - "Смена BPM, долей или первой доли на хосте слышна у всех со следующей доли, без обрывов щелчков."
  - "iPhone (Safari) и Android (Chrome); Bluetooth-наушники — синхронно в установившемся режиме после подстройки."
  - "Роль Listen не открывает /ws и /preview; сброс пароля слушателей отключает их."
